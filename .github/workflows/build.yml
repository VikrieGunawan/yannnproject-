name: Malachite GKI 6.1 Android 17

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Malachite GKI
runs-on: ubuntu-24.04
timeout-minutes: 360

steps:
  - name: Checkout kernel source
    uses: actions/checkout@v4
    with:
      path: kernel

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        bc bison build-essential flex \
        git curl wget zip unzip \
        libssl-dev libelf-dev \
        python3 python3-pip \
        gcc-aarch64-linux-gnu \
        gcc-arm-linux-gnueabi \
        device-tree-compiler \
        ccache

  - name: Clone Malachite Android 17 device tree
    run: |
      git clone --depth=1 \
        https://github.com/malachite-project/android_device_xiaomi_malachite.git \
        device_tree

  - name: Setup Clang
    run: |
      git clone --depth=1 \
        https://github.com/llvm/llvm-project.git \
        --filter=blob:none \
        llvm-project

  - name: Check source structure
    run: |
      echo "===== KERNEL SOURCE ====="
      ls -lah kernel

      echo "===== DEVICE TREE ====="
      ls -lah device_tree

      echo "===== KERNEL CONFIG ====="
      find kernel -name '*defconfig' -o -name 'build.config*'

  - name: Build kernel
    run: |
      cd kernel

      echo "Kernel source:"
      make -s kernelversion

      echo "Build configuration must be supplied here."
      echo "Stopping until the correct GKI build target is configured."

  - name: Upload build logs
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: malachite-gki-build-logs
      path: |
        kernel/
        device_tree/
      retention-days: 3
